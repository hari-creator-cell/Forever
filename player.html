<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forever Experience</title><style>
:root{--bg:#080914;--card:#141625;--pink:#ff6b9f;--muted:#aeb4c7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#35172c,#080914 55%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(720px,calc(100% - 28px));margin:14px;padding:30px 22px;text-align:center;background:#141625ee;border:1px solid #30354c;border-radius:28px;box-shadow:0 20px 80px #0008}.heart{font-size:64px}.msg{white-space:pre-wrap;color:#d9dce7;font-size:18px;line-height:1.6}.media{max-width:100%;border-radius:18px;margin:18px auto;display:block}.photo{max-height:360px}.actions{position:relative;height:150px;max-width:520px;margin:10px auto}.btn{border:0;border-radius:999px;padding:14px 25px;font-weight:800;font-size:16px}.yes{background:linear-gradient(135deg,#ff5b9d,#ff8a77);color:#fff}.no{background:#292e42;color:#fff;position:absolute;left:50%;top:70px;transform:translateX(-115%);touch-action:manipulation}.mute{background:#24283a;color:#fff;border:1px solid #3a4058;margin-top:10px}.muted{color:var(--muted)}.finale{animation:pop .5s ease}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}.confetti{font-size:30px;letter-spacing:8px}.error{color:#ff9eae}</style></head><body><div id="x" class="box">Loading your experience…</div><script>
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let d=null,audio=null,muted=false,attempts=0,noBusy=false;
async function api(q){const r=await fetch("/api?"+new URLSearchParams(q));const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||"Experience unavailable.");return x}
async function media(id){try{const x=await api({action:"getMedia",file_id:id});return x.dataUri}catch(e){return null}}
async function go(){try{const id=location.pathname.split("/").filter(Boolean).pop();const r=await api({action:"experience",id});d=r.experience;let photo="",sound="";if(d.photoFileId)photo=await media(d.photoFileId);if(d.audioFileId)sound=await media(d.audioFileId);renderStart(photo,sound)}catch(e){document.getElementById("x").innerHTML='<h2>Experience unavailable</h2><p class="error">'+esc(e.message)+"</p>"}}
function renderStart(photo,sound){document.getElementById("x").innerHTML='<div class="heart">💗</div><h1>Hey '+esc(d.recipientName)+'…</h1><p class="msg">'+esc(d.message||"Something beautiful was made just for you.")+'</p>'+(photo?'<img class="media photo" src="'+photo+'" alt="A special memory">':'')+(sound?'<audio id="audio" loop src="'+sound+'"></audio><button class="btn mute" id="mute">🔊 Sound on</button>':'')+'<div id="game"><div class="actions"><button class="btn no" id="no">NO</button><button class="btn yes" id="yes">YES ❤️</button></div><p class="muted">Be honest… 😌</p></div>';
audio=document.getElementById("audio");if(audio){audio.volume=.45;audio.play().catch(()=>{});document.getElementById("mute").onclick=()=>{muted=!muted;audio.muted=muted;document.getElementById("mute").textContent=muted?"🔇 Sound off":"🔊 Sound on"}}
document.getElementById("yes").onclick=()=>finish(true);document.getElementById("no").addEventListener("pointerdown",ev=>{ev.preventDefault();ev.stopPropagation();moveNo()});document.getElementById("no").addEventListener("click",ev=>{ev.preventDefault();moveNo()});}
function moveNo(){if(noBusy)return;noBusy=true;attempts++;const b=document.getElementById("no"),zone=document.querySelector(".actions");if(attempts>=21){finish(false);return}const maxX=Math.max(0,zone.clientWidth-b.offsetWidth-10),maxY=Math.max(0,zone.clientHeight-b.offsetHeight-10);let x=Math.random()*maxX,y=Math.random()*maxY;const yes=document.getElementById("yes").getBoundingClientRect(),zr=zone.getBoundingClientRect();for(let i=0;i<12;i++){const tx=Math.random()*maxX,ty=Math.random()*maxY,rx=zr.left+tx,ry=zr.top+ty;if(!(rx<yes.right+24&&rx+b.offsetWidth>yes.left-24&&ry<yes.bottom+24&&ry+b.offsetHeight>yes.top-24)){x=tx;y=ty;break}}b.style.left=x+"px";b.style.top=y+"px";b.style.transform="none";setTimeout(()=>noBusy=false,180)}
function finish(fromYes){if(audio){audio.pause()}const title=fromYes?"YES! 💗":"After 21 NOs… ❤️";document.getElementById("game").innerHTML='<div class="finale"><div class="confetti">✨ 💗 ✨ 💗 ✨</div><h2>'+title+'</h2><p class="msg">'+(fromYes?"Forever starts here.":"Maybe there is only one answer left.")+'</p><button class="btn yes" onclick="this.textContent=\'Forever starts here 💖\';this.disabled=true">'+(fromYes?"Forever 💖":"YES ❤️")+'</button></div>'}
go();
</script></body></html>
