<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Something for you · Forever</title>
<style>
:root{--bg:#080914;--muted:#aeb4c7}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#35172c,#080914 55%);color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:14px}
#x{width:min(560px,100%);margin:auto}
.box{background:#141625ee;border:1px solid #30354c;border-radius:28px;padding:34px 22px;text-align:center;box-shadow:0 20px 80px #0008}
.box h2{margin:10px 0 6px}
.box p{color:var(--muted);margin:6px 0}
.big{font-size:54px}
a.home{display:inline-block;margin-top:16px;color:#ff8fbb;font-weight:700}
</style>
</head>
<body>
<div id="x"><div class="box"><div class="big">💗</div><p>Loading your experience…</p></div></div>
<script src="/exp-engine.js"></script>
<script>
(function(){
  var host=document.getElementById("x");
  var MSG={
    E_NOT_FOUND:["🔍","Experience not found","This link doesn't match any experience. Please check it with the person who sent it."],
    E_EXPIRED:["⏳","This experience has expired","The link isn't active anymore."],
    E_UNAVAILABLE:["🔒","No longer available","The creator has turned this experience off."],
    E_LIMIT:["🚪","Visit limit reached","This experience has been opened the maximum number of times."],
    E_NETWORK:["📡","You seem to be offline","Check your connection and try again."],
    E_SERVER:["🙈","Something went wrong","We couldn't load this right now. Please try again in a moment."]
  };
  function fail(code){
    var m=MSG[code]||MSG.E_SERVER;
    host.innerHTML='<div class="box"><div class="big">'+m[0]+'</div><h2>'+ForeverExp.esc(m[1])+'</h2><p>'+ForeverExp.esc(m[2])+'</p><button id="retry" style="margin-top:14px;border:0;border-radius:999px;padding:12px 22px;font-weight:800;background:#292e42;color:#fff;cursor:pointer">Try again</button></div>';
    document.getElementById("retry").onclick=function(){location.reload()};
  }
  async function call(q){
    var r,x;
    try{r=await fetch("/api?"+new URLSearchParams(q))}catch(e){var n=new Error("net");n.code="E_NETWORK";throw n}
    try{x=await r.json()}catch(e){var s=new Error("bad");s.code="E_SERVER";throw s}
    if(!r.ok||!x||x.ok===false){var c=new Error("api");c.code=(x&&x.code&&MSG[x.code])?x.code:"E_SERVER";throw c}
    return x;
  }
  async function media(id,kind){
    try{var x=await call({action:"getMedia",id:id,kind:kind});return x.dataUri}catch(e){return null}
  }
  async function go(){
    try{
      var id=decodeURIComponent(location.pathname.split("/").filter(Boolean).pop()||"");
      var r=await call({action:"experience",id:id});   // also records the visit
      var d=r.experience;
      var res=await Promise.all([d.hasPhoto?media(d.id,"photo"):null,d.hasAudio?media(d.id,"audio"):null]);
      host.innerHTML="";
      ForeverExp.render(host,{template:d.template,recipientName:d.recipientName,message:d.message,finalMessage:d.finalMessage,photoUrl:res[0],audioUrl:res[1]},{preview:false});
    }catch(e){fail(e.code)}
  }
  go();
})();
</script>
</body>
</html>
