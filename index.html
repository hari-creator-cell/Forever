<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forever</title>
<style>
:root{--bg:#090a12;--card:#141725;--muted:#9ea5ba;--text:#f7f7fb;--pink:#ff6da8;--gold:#f5d789}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#32192f,#090a12 45%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#141725dd;border:1px solid #2b3044;border-radius:22px;padding:20px}.hidden{display:none}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.brand{font-size:27px;font-weight:800}.pink{color:var(--pink)}.muted{color:var(--muted)}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth .card{width:min(440px,100%)}input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #34394e;background:#0d0f18;color:#fff;margin:7px 0 15px}textarea{min-height:110px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700}.primary{background:linear-gradient(135deg,#ff5b9d,#ff8b73);color:#fff}.secondary{background:#22263a;color:#fff;border:1px solid #363c53}.hero{padding:50px 0}.hero h1{font-size:clamp(40px,8vw,76px);line-height:.98;margin:12px 0}.hero p{max-width:720px;color:#c2c7d5;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile{min-height:150px}.price{color:var(--gold);font-weight:800}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat b{font-size:28px;display:block;margin-top:5px}.top{border-bottom:1px solid #24283a;position:sticky;top:0;background:#090a12dd;backdrop-filter:blur(12px);z-index:4}footer{text-align:center;padding:40px;color:#737b91}.error{color:#ff9cab}.ok{color:#7fe0b0}.notice{background:#201e2c;border-radius:12px;padding:12px;margin:12px 0;color:#d3d1df}
</style></head><body><div id="app"></div><script src="https://accounts.google.com/gsi/client" async defer></script><script>
const OWNER="h9302782@gmail.com";let user=null,lastCredential=null,state={screen:"login",selected:"the-escaping-no",occ:"proposals",q:""};
const C=[["the-escaping-no","The Escaping NO","proposals","funny",99,false,"A playful interactive proposal with a cinematic finale."],["sweet-simple","Sweet & Simple","proposals","romantic",0,true,"A clean heartfelt proposal."],["written-stars","Written in the Stars","proposals","dreamy",149,false,"A dreamy journey through memories and clues."],["our-love-story","Our Love Story","proposals","story",199,false,"A cinematic story experience."],["classic-birthday","Classic Birthday","birthday","simple",0,true,"A simple birthday experience."],["birthday-game","Birthday Game","birthday","fun",79,false,"A playful birthday challenge."]];
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const api=b=>fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>{let x=await r.json();if(!r.ok||x.ok===false)throw Error(x.error||"Request failed");return x});
function card(x){return `<div class="card tile"><div style="font-size:30px">${x[2]=="birthday"?"🎂":"💍"}</div><h3>${x[1]}</h3><p class="muted">${x[6]}</p><div class="price">${x[5]?"FREE":"₹"+x[4]}</div><button class="btn primary" data-use="${x[0]}" style="margin-top:10px">Use this experience</button></div>`}
function render(){let a=document.getElementById("app");a.innerHTML=state.screen=="login"?login():state.screen=="home"?home():state.screen=="occ"?occ():state.screen=="create"?create():state.screen=="admin"?admin():transition();bind()}
function login(){return `<div class="auth"><div class="card"><div class="brand">Forever <span class="pink">♥</span></div><p class="muted">Make it a memory.</p><div id="g"></div><div id="m"></div><div class="notice">Sign in with Google to create and manage experiences.</div></div></div>`}
function transition(){return `<div class="auth"><div style="text-align:center;font-size:22px">♥<h2>Preparing something beautiful…</h2></div></div>`}
function home(){return `<div class="top"><div class="wrap row between"><div class="brand">Forever <span class="pink">♥</span></div><div class="row">${user?.name||""}${user?.email===OWNER?'<button class="btn secondary" id="adm">⚡ Admin</button>':""}<button class="btn secondary" id="logout">Logout</button></div></div></div><main class="wrap"><section class="hero"><div class="muted">PRIVATE MOMENTS · MADE BEAUTIFUL</div><h1>Don't just ask.<br><span class="pink">Make it a memory.</span></h1><p>Create personalized interactive experiences for proposals, birthdays and special moments.</p><button class="btn primary" id="create">Create an Experience →</button></section><h2>Choose your moment</h2><div class="grid"><div class="card tile" data-o="proposals">💍<h3>Proposals</h3><p class="muted">Interactive proposal experiences</p></div><div class="card tile" data-o="birthday">🎂<h3>Birthday Wishes</h3><p class="muted">Make their birthday memorable</p></div><div class="card tile">🎓<h3>Congratulations</h3><p class="muted">Coming soon</p></div><div class="card tile">🎁<h3>Free Cards</h3><p class="muted">Simple cards</p></div></div><h2>Featured</h2><div class="grid">${C.slice(0,4).map(card).join("")}</div></main><footer>Made for moments worth remembering · Forever</footer>`}
function occ(){let a=C.filter(x=>x[2]==state.occ);if(state.q)a=a.filter(x=>(x[1]+x[6]).toLowerCase().includes(state.q.toLowerCase()));return `<main class="wrap"><div class="row"><button class="btn secondary" id="back">←</button><h2>${state.occ=="birthday"?"🎂 Birthday Wishes":"💍 Proposals"}</h2></div><input id="q" placeholder="Search experiences…" value="${esc(state.q)}"><div class="grid">${a.map(card).join("")}</div></main>`}
function create(){let x=C.find(x=>x[0]==state.selected)||C[0];return `<main class="wrap"><div class="row"><button class="btn secondary" id="back">←</button><h2>Create: ${x[1]}</h2></div><div class="card" style="max-width:700px"><label>Recipient name</label><input id="rn" placeholder="Their name"><label>Message</label><textarea id="msg" placeholder="Write your message…"></textarea><label>Photo (optional)</label><input id="photo" type="file" accept="image/*"><label>Audio (optional)</label><input id="audio" type="file" accept="audio/*"><div class="notice">MVP files are stored in your Google Drive Forever folder.</div><button class="btn primary" id="gen">Generate My Link ✨</button><div id="out"></div></div></main>`}
function admin(){return `<main class="wrap"><div class="row between"><div><h2>⚡ Forever Admin</h2><div class="muted">${OWNER}</div></div><button class="btn secondary" id="back">← Home</button></div><div id="st" class="section">Loading…</div><div class="card"><div class="row between"><h3>Experience management</h3><button class="btn primary" id="add">+ Add Experience</button></div><div id="top"></div></div></main>`}
function bind(){document.querySelectorAll("[data-o]").forEach(e=>e.onclick=()=>{state.occ=e.dataset.o;state.q="";state.screen="occ";render()});document.querySelectorAll("[data-use]").forEach(e=>e.onclick=()=>{state.selected=e.dataset.use;state.screen="create";render()});let b=document.getElementById("create");if(b)b.onclick=()=>{state.screen="create";render()};b=document.getElementById("adm");if(b)b.onclick=()=>{state.screen="admin";render();loadAdmin()};b=document.getElementById("logout");if(b)b.onclick=()=>{user=null;lastCredential=null;state.screen="login";render()};b=document.getElementById("back");if(b)b.onclick=()=>{state.screen="home";render()};let q=document.getElementById("q");if(q)q.oninput=()=>{state.q=q.value;render();setTimeout(()=>{let z=document.getElementById("q");z.focus();z.setSelectionRange(z.value.length,z.value.length)},0)};b=document.getElementById("gen");if(b)b.onclick=generate;if(document.getElementById("add"))document.getElementById("add").onclick=()=>{state.screen="create";render()};if(state.screen=="login")setTimeout(googleLogin,400)}
function googleLogin(){if(!window.google)return;google.accounts.id.initialize({client_id:"470822665933-5g9960ptd660e6f3d8s03p3mdp50gm2c.apps.googleusercontent.com",callback:r=>{lastCredential=r.credential;api({action:"login",idToken:lastCredential}).then(x=>{user=x.user;state.screen="transition";render();setTimeout(()=>{state.screen="home";render()},700)}).catch(e=>document.getElementById("m").innerHTML='<div class="error">'+esc(e.message)+'</div>')}});google.accounts.id.renderButton(document.getElementById("g"),{theme:"outline",size:"large",width:350})}
const data=f=>new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok({name:f.name,type:f.type,data:r.result.split(",")[1]});r.onerror=no;r.readAsDataURL(f)});
async function generate(){try{let n=document.getElementById("rn").value.trim();if(!n)throw Error("Enter recipient name.");let x=C.find(x=>x[0]==state.selected)||C[0],files={};for(let k of ["photo","audio"]){let f=document.getElementById(k).files[0];if(f){if(f.size>12*1024*1024)throw Error("Each file must be under 12 MB for this MVP.");files[k]=await data(f)}}let r=await api({action:"createExperience",idToken:lastCredential,experience:{type:x[0],title:x[1],recipientName:n,message:document.getElementById("msg").value,price:x[4]},files});document.getElementById("out").innerHTML='<div class="ok">Created! <a href="'+(r.url||('/p/'+r.id))+'" target="_blank">'+(r.url||('/p/'+r.id))+"</a></div>"}catch(e){document.getElementById("out").innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadAdmin(){try{let r=await api({action:"adminStats",idToken:lastCredential}),s=r.stats;document.getElementById("st").innerHTML='<div class="stats">'+[["Users",s.overall.users],["Visitors",s.overall.visitors],["Experiences",s.overall.experiences],["Revenue","₹"+s.overall.revenue],["Today users",s.today.newUsers],["Today logins",s.today.logins],["Today visitors",s.today.visitors],["Today revenue","₹"+s.today.revenue]].map(x=>'<div class="card stat">'+x[0]+'<b>'+x[1]+"</b></div>").join("")+"</div>";document.getElementById("top").innerHTML="<h3>Top paid experiences</h3>"+(s.topExperiences||[]).map(x=>"<p>"+esc(x.title)+" — "+x.orders+" paid orders</p>").join("")}catch(e){document.getElementById("st").innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
render();
</script></body></html>
